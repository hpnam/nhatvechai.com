<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nhặt Ve Chai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #000;
    overflow-x: hidden;
    color: #f5e27a;
    font-family: "VT323", monospace;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Vignette + red atmosphere */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, rgba(120, 10, 0, 0.28) 0%, rgba(0,0,0,0) 60%),
      radial-gradient(circle at 50% 100%, rgba(60, 20, 0, 0.5) 0%, rgba(0,0,0,0) 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Smoky paper noise overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: overlay;
  }

  /* ====== Outer red glow ring — không xoay, mờ rõ mờ rõ ====== */
  .bg-bagua {
    position: fixed;
    top: 50%; left: 50%;
    width: clamp(280px, 70vmin, 720px);
    height: clamp(280px, 70vmin, 720px);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: bagua-breath 4s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
    will-change: opacity, box-shadow;
  }
  /* ====== Pixel-art Taiji (Thái Cực) — xoay đều, không pulse ====== */
  #taiji {
    position: fixed;
    top: 50%; left: 50%;
    width: clamp(220px, 52vmin, 540px);
    height: clamp(220px, 52vmin, 540px);
    z-index: 1;
    pointer-events: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    opacity: 0.3;
    filter: drop-shadow(0 0 14px rgba(255, 100, 30, 0.5));
    animation: taiji-spin 24s linear infinite;
    will-change: transform;
  }

  @keyframes taiji-spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  @keyframes bagua-breath {
    0%, 100% {
      opacity: 0.40;
      box-shadow:
        0 0 40px 6px rgba(255, 30, 0, 0.25),
        0 0 90px 18px rgba(200, 0, 0, 0.12),
        inset 0 0 30px rgba(255, 0, 0, 0.45),
        inset 0 0 80px rgba(180, 0, 0, 0.18);
    }
    50% {
      opacity: 0.60;
      box-shadow:
        0 0 70px 12px rgba(255, 30, 0, 0.50),
        0 0 140px 32px rgba(200, 0, 0, 0.25),
        inset 0 0 45px rgba(255, 0, 0, 0.75),
        inset 0 0 105px rgba(180, 0, 0, 0.32);
    }
  }

  /* ====== Stage ====== */
  .stage {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 4vmin, 56px) 20px;
    gap: clamp(14px, 2vmin, 28px);
  }

  /* ====== Header ====== */
  .header {
    text-align: center;
    z-index: 4;
  }
  .hanzi {
    font-family: 'Ma Shan Zheng', 'Noto Serif', serif;
    font-size: clamp(56px, 10vmin, 110px);
    color: #f5e27a;
    letter-spacing: 0.22em;
    line-height: 1;
    margin: 0;
    text-shadow:
      0 0 18px rgba(255, 80, 30, 0.7),
      0 0 36px rgba(255, 30, 0, 0.35),
      0 2px 0 rgba(0,0,0,0.85);
  }
  .hanzi .sep {
    color: #c9a649;
    font-size: 0.75em;
    margin: 0 0.1em;
    vertical-align: middle;
  }
  .title {
    font-family: 'Playfair Display', 'Noto Serif', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(18px, 2.6vmin, 26px);
    color: #d4af37;
    letter-spacing: 0.45em;
    margin: 14px 0 4px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
  }
  .subtitle {
    font-size: 10px;
    letter-spacing: 0.45em;
    color: rgba(200, 170, 130, 0.7);
    text-transform: uppercase;
  }
  .subtitle .blink {
    display: inline-block;
    color: #ef4444;
    animation: blink 1.2s steps(2, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ====== Poem ====== */
  .poem {
    position: relative;
    text-align: center;
    z-index: 4;
    padding: clamp(28px, 4vmin, 48px) clamp(20px, 5vw, 56px);
    max-width: 720px;
    margin: 0 auto;
  }
  .poem::before, .poem::after {
    content: '';
    position: absolute;
    left: 50%; transform: translateX(-50%);
    width: clamp(180px, 40%, 320px);
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(212, 175, 55, 0) 5%,
      rgba(212, 175, 55, 0.6) 50%,
      rgba(212, 175, 55, 0) 95%,
      transparent);
  }
  .poem::before { top: 0; }
  .poem::after  { bottom: 0; }

  .stanza {
    margin: 0 0 clamp(18px, 3vmin, 28px);
  }
  .stanza:last-child { margin-bottom: 0; }

  .verse {
    font-family: "VT323", monospace;
    font-size: clamp(24px, 3.6vmin, 34px);
    line-height: 1.7;
    color: #f5e27a;
    text-shadow:
      0 0 12px rgba(255, 80, 30, 0.45),
      0 0 24px rgba(255, 30, 0, 0.18),
      0 0 2px rgba(245, 226, 122, 0.6);
    margin: 0;
    opacity: 0;
    transform: translateY(8px);
    filter: blur(4px);
    animation: appear 1.6s ease-out 0.4s forwards;
    letter-spacing: 0.02em;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(10px); filter: blur(5px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  .stanza-sep {
    color: rgba(212, 175, 55, 0.5);
    font-size: 12px;
    letter-spacing: 0.5em;
    margin: 8px 0;
    opacity: 0;
    animation: appear 1.6s ease-out 0.4s forwards;
  }

  /* ====== Incense burner ====== */
  .censer-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: auto;
    padding-top: 8px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: transparent;
    display: block;
    cursor: pointer;
    filter: drop-shadow(0 0 14px rgba(255, 100, 30, 0.35));
  }

  .seal {
    margin-top: 10px;
    font-family: 'Ma Shan Zheng', serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: rgba(239, 68, 68, 0.85);
    text-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    padding: 4px 12px;
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 2px;
    background: rgba(40, 5, 0, 0.4);
  }

  .hint {
    margin-top: 12px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.28em;
    color: rgba(150, 110, 80, 0.75);
    line-height: 1.8;
  }
  .hint kbd {
    display: inline-block;
    padding: 3px 8px;
    background: rgba(40, 20, 10, 0.6);
    border: 1px solid rgba(110, 80, 50, 0.5);
    border-bottom: 2px solid rgba(20, 10, 5, 0.9);
    color: #d4af37;
    font-family: 'Courier New', monospace;
    font-size: 9px;
    margin: 0 3px;
    border-radius: 2px;
    text-shadow: none;
  }

  @media (max-width: 540px) {
    .poem { padding: 22px 10px; }
    .title { letter-spacing: 0.3em; }
  }
  @media (max-height: 760px) {
    .hanzi { font-size: clamp(40px, 8vmin, 70px); }
    .title { margin: 10px 0 2px; }
    .verse { line-height: 1.75; }
  }
</style>
</head>
<body>

<!-- Background: rotating red glow ring + static pixel-art Taiji (Thái Cực) -->
<div class="bg-bagua"></div>
<canvas id="taiji" width="96" height="96"></canvas>

<div class="stage">

  <section class="poem">
    <div class="stanza">
      <p class="verse">Thế nhân trọng vật bởi nhu cầu</p>
      <p class="verse">Hữu dụng thiên kim, phế tựa sầu</p>
      <p class="verse">Nhất nhật vô cầu thành phế thải</p>
      <p class="verse">Hữu thời vi mạt hóa trân châu</p>
    </div>

    <div class="stanza-sep">❖</div>

    <div class="stanza">
      <p class="verse">Vật vốn vô thường nan định giá</p>
      <p class="verse">Nhân tâm hữu niệm định sang giàu</p>
      <p class="verse">Thịnh suy bất tại hình cùng tướng</p>
      <p class="verse">Chỉ tại nhân gian hữu dụng cầu</p>
    </div>
  </section>


</div>

<script>
// ===== Pixel-art Taiji (Thái Cực — âm dương) =====
(() => {
  const c = document.getElementById('taiji');
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = c.width, H = c.height;
  const cx = W / 2, cy = H / 2;

  const COL = {
    yang:    '#f5e27a',  // Dương (sáng) — vàng kim
    yin:     '#4a1f10',  // Âm (tối) — đỏ trầm/nâu đỏ (đủ tương phản với nền đen)
    eyeYang: '#f5e27a',  // mắt dương: vàng (trong vùng âm)
    eyeYin:  '#1a0606',  // mắt âm: đen sâu (trong vùng dương)
    ring:    '#d4af37',  // viền kim quanh thái cực
  };

  function disc(cx, cy, r, color) {
    ctx.fillStyle = color;
    for (let y = -r; y <= r; y++) {
      const w = Math.floor(Math.sqrt(r * r - y * y));
      ctx.fillRect((cx - w) | 0, (cy + y) | 0, 2 * w + 1, 1);
    }
  }

  function thickRing(cx, cy, rOut, rIn, color) {
    ctx.fillStyle = color;
    for (let y = -rOut; y <= rOut; y++) {
      const wo = Math.floor(Math.sqrt(rOut * rOut - y * y));
      let wi = 0;
      if (Math.abs(y) < rIn) wi = Math.floor(Math.sqrt(rIn * rIn - y * y));
      if (wi > 0) {
        ctx.fillRect((cx - wo) | 0, (cy + y) | 0, wo - wi, 1);
        ctx.fillRect((cx + wi + 1) | 0, (cy + y) | 0, wo - wi, 1);
      } else {
        ctx.fillRect((cx - wo) | 0, (cy + y) | 0, 2 * wo + 1, 1);
      }
    }
  }

  ctx.clearRect(0, 0, W, H);

  const R     = 42;       // bán kính thái cực
  const halfR = R / 2;    // bán kính 2 cung S

  // 1. Nửa trên = Dương (vàng)
  ctx.fillStyle = COL.yang;
  for (let y = -R; y < 0; y++) {
    const w = Math.floor(Math.sqrt(R * R - y * y));
    ctx.fillRect((cx - w) | 0, (cy + y) | 0, 2 * w + 1, 1);
  }

  // 2. Nửa dưới = Âm (đỏ trầm)
  ctx.fillStyle = COL.yin;
  for (let y = 0; y <= R; y++) {
    const w = Math.floor(Math.sqrt(R * R - y * y));
    ctx.fillRect((cx - w) | 0, (cy + y) | 0, 2 * w + 1, 1);
  }

  // 3. Cung S phải — đuôi dương chìa xuống phải (vùng dương lan vào âm)
  disc(cx + halfR, cy, halfR, COL.yang);

  // 4. Cung S trái — đuôi âm chìa lên trái (vùng âm lan vào dương)
  disc(cx - halfR, cy, halfR, COL.yin);

  // 5. Mắt — chấm pixel màu đối lập, đặt tại tâm 2 cung S
  // Mắt âm (đen) bên trong vùng dương (đuôi dương phía dưới phải)
  disc(cx + halfR, cy, 3, COL.eyeYin);
  // Mắt dương (vàng) bên trong vùng âm (đuôi âm phía trên trái)
  disc(cx - halfR, cy, 3, COL.eyeYang);

  // 6. Viền vàng kim quanh thái cực (định hình rõ trên nền đen)
  thickRing(cx, cy, R + 2, R + 1, COL.ring);
})();

// ===== Phím R: chạy lại hiệu ứng fade-in =====
(() => {
  function replayPoem() {
    document.querySelectorAll('.verse, .stanza-sep').forEach(el => {
      el.style.animation = 'none';
      void el.offsetHeight; // force reflow
      el.style.animation = '';
    });
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') replayPoem();
  });
})();
</script>
</body>
</html>
